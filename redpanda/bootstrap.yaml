# Cluster properties applied on first start. Everything here maps to a
# Redpanda Cloud behaviour we want to demonstrate locally.

superusers: ["admin"]

# --- Authentication: SCRAM for service accounts, OIDC for humans -----------
sasl_mechanisms: ["SCRAM", "OAUTHBEARER"]
http_authentication: ["BASIC", "OIDC"]
admin_api_require_auth: true
# Per-listener `authentication_method: sasl` does NOT enable authorization on its
# own (kafka_enable_authorization defaults to following enable_sasl). Without
# this, every authenticated principal can read every topic.
kafka_enable_authorization: true

oidc_discovery_url: "http://keycloak/realms/acme/.well-known/openid-configuration"
oidc_token_audience: "redpanda"
oidc_principal_mapping: "$.preferred_username"
oidc_clock_skew_tolerance: 5
# Drop Kafka connections when the bearer token expires (bounds the JIT window)
oidc_token_expire_disconnect: true
# JWKS cache lifetime. Redpanda does not re-fetch keys when it sees an unknown
# `kid`, so after an IdP signing-key rotation, tokens fail for up to this long
# (default 3600s). Verified locally; see FINDINGS.md.
oidc_keys_refresh_interval: 300

# --- GBAC: Okta/Keycloak put a flat `groups` array in the access token -----
oidc_group_claim_path: "$.groups"
nested_group_behavior: "none"

# --- Schema Registry ACLs (off by default!) --------------------------------
schema_registry_enable_authorization: true

# --- Audit logging ----------------------------------------------------------
audit_enabled: true
audit_enabled_event_types: ["management", "authenticate", "admin", "consume", "schema_registry"]
# High-volume service accounts are excluded so human reads stand out.
# KNOWN ISSUE (v26.2.2): a value loaded at startup — from here or persisted
# before a restart — is ignored until the property is changed at runtime.
# See tests/q7_audit.sh and FINDINGS.md.
audit_excluded_principals: ["svc-wallet-consumer", "svc-wallet-producer", "svc-scribe-producer"]
